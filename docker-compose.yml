services:
  trading-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trading-app.rule=Host(`trade.fxengen.com`)"
      - "traefik.http.routers.trading-app.entrypoints=websecure"
      - "traefik.http.routers.trading-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.trading-app.loadbalancer.server.port=3001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
